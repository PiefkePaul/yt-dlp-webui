name: Build Demo Archive

# Download and serve the archive on a static host; publishing is always manual.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run pages:build
      - uses: actions/upload-artifact@v3
        with:
          name: static-demo
          path: dist-pages/
