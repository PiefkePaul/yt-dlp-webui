name: Publish Server Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    container: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --omit=dev
      - run: npm run verify
      - run: npm run release:build
      - name: Publish Gitea release
        env:
          RELEASE_API_URL: ${{ gitea.api_url }}
          RELEASE_REPOSITORY: ${{ gitea.repository }}
          RELEASE_TAG: ${{ gitea.ref_name }}
          RELEASE_REF_TYPE: ${{ gitea.ref_type }}
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-gitea-release.js
