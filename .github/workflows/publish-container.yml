name: Publish Container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

# Images go to the Gitea container registry on the NAS (pulled as
# git.scholz-cloud.de/piefkepaul/yt-dlp-webui) instead of ghcr.io (GitHub
# storage quota), and, as an off-site copy, to Docker Hub. Built on the NAS
# runners, which push to Gitea inside ci-net as plain http (gitea:3000): the
# public name runs through Cloudflare, which rejects request bodies over 100 MB.
env:
  IMAGE_NAME: yt-dlp-webui
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The build record would be uploaded as an Actions artifact (full GitHub storage).
  DOCKER_BUILD_RECORD_UPLOAD: false
  GITEA_REGISTRY: gitea:3000

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '["self-hosted","nas","yt-dlp-webui"]') }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Builder in the slot's network namespace (ci-net): resolves gitea:3000, plain http.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."gitea:3000"]
              http = true
              insecure = true

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITEA_REGISTRY }}
          username: ${{ vars.GITEA_REGISTRY_USER || 'piefkepaul' }}
          password: ${{ secrets.GITEA_REGISTRY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Normalize image owners
        id: owners
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "gitea_owner=$(echo "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "dockerhub_owner=$(echo "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GITEA_REGISTRY }}/${{ steps.owners.outputs.gitea_owner }}/${{ env.IMAGE_NAME }}
            ${{ steps.owners.outputs.dockerhub_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
